name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/grs.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile cards from GitHub API
        env:
          GITHUB_USERNAME: lingxitong
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/header.svg profile/about.svg profile/focus.svg profile/stats.svg profile/top-langs.svg profile/stats-neon.svg profile/langs-neon.svg profile/pin-*.svg
          git commit -m "Update README cards" || exit 0
          git push

