<svg xmlns="http://www.w3.org/2000/svg" width="460" height="310" viewBox="0 0 460 310" role="img" aria-label="lingxitong GitHub stats">
<defs>
  <linearGradient id="statsStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#660874"/>
    <stop offset="100%" stop-color="#9B59B6"/>
  </linearGradient>
  <linearGradient id="heroFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4A0A5C"/>
    <stop offset="55%" stop-color="#660874"/>
    <stop offset="100%" stop-color="#B8860B"/>
  </linearGradient>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .title { font: 600 15px 'Segoe UI', Ubuntu, Sans-Serif; fill: #660874; }
  .label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6B4E78; }
  .value { font: 700 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #3D0A4A; }
  .hero-label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #F3E8FF; }
  .hero-num { font: 800 34px 'Segoe UI', Ubuntu, Sans-Serif; fill: #FFE08A; }
  .hero-sub { font: 600 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #EDE0F5; }
  .card { fill: #FCF8FF; stroke: url(#statsStroke); }
  .track { fill: #EDE0F5; }
  .row { opacity: 0; animation: rowIn 0.55s ease forwards; }
  .star { transform-origin: 48px 70px; animation: starPulse 1.6s ease-in-out infinite; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes starPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @keyframes sheen {
    0% { transform: translateX(-120px); opacity: 0; }
    35% { opacity: 0.35; }
    100% { transform: translateX(420px); opacity: 0; }
  }
  .sheen { animation: sheen 2.8s ease-in-out infinite; }
</style>
<rect class="card" x="0.5" y="0.5" width="459" height="309" rx="10"/>
<text class="title" x="18" y="28">lingxitong's GitHub Stats</text>

<g transform="translate(14, 40)">
  <rect x="0" y="0" width="432" height="84" rx="12" fill="url(#heroFill)"/>
  <rect class="sheen" x="0" y="0" width="70" height="84" fill="#ffffff" opacity="0.18"/>
  <g class="star" filter="url(#softGlow)">
    <polygon points="48,18 53,36 72,36 57,48 63,66 48,54 33,66 39,48 24,36 43,36" fill="#FFD54A">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.6s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <text class="hero-label" x="118" y="28">Total Stars</text>
  <text class="hero-num roll" x="118" y="88" text-anchor="start" opacity="0">99<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="0.16s" begin="0.00s" fill="remove"/></text><text class="hero-num roll" x="118" y="88" text-anchor="start" opacity="0">198<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="0.16s" begin="0.16s" fill="remove"/></text><text class="hero-num roll" x="118" y="88" text-anchor="start" opacity="0">298<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="0.16s" begin="0.32s" fill="remove"/></text><text class="hero-num roll" x="118" y="88" text-anchor="start" opacity="0">397<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="0.16s" begin="0.48s" fill="remove"/></text><text class="hero-num roll" x="118" y="88" text-anchor="start" opacity="0">496<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="0.16s" begin="0.64s" fill="remove"/></text><text class="hero-num roll" x="118" y="88" text-anchor="start" opacity="0">596<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="0.16s" begin="0.80s" fill="remove"/></text><text class="hero-num roll" x="118" y="88" text-anchor="start" opacity="0">695<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="0.16s" begin="0.96s" fill="remove"/></text><text class="hero-num" x="118" y="88" text-anchor="start" opacity="0">795<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.12s" fill="freeze"/></text>
  <text class="hero-sub" x="118" y="70">across public repositories</text>
  <circle cx="400" cy="42" r="18" fill="none" stroke="#FFE08A" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="113" stroke-dashoffset="113">
    <animate attributeName="stroke-dashoffset" from="113" to="18" dur="1.4s" fill="freeze"
             calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </circle>
</g>

<g class="row" style="animation-delay: 1.40s"><circle cx="28" cy="160" r="4" fill="#82318E"><animate attributeName="r" values="0;5;4" dur="0.45s" begin="1.40s" fill="freeze"/></circle><text class="label" x="42" y="164">Total Forks</text><rect class="track" x="170" y="154" width="150" height="7" rx="3.5"/><rect class="bar" x="170" y="154" width="0" height="7" rx="3.5" fill="#82318E"><animate attributeName="width" from="0" to="84.5" dur="0.9s" begin="1.40s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect><text class="value" x="438" y="164" text-anchor="end" opacity="0">58<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.65s" fill="freeze"/></text></g><g class="row" style="animation-delay: 1.52s"><circle cx="28" cy="190" r="4" fill="#660874"><animate attributeName="r" values="0;5;4" dur="0.45s" begin="1.52s" fill="freeze"/></circle><text class="label" x="42" y="194">Public Repos</text><rect class="track" x="170" y="184" width="150" height="7" rx="3.5"/><rect class="bar" x="170" y="184" width="0" height="7" rx="3.5" fill="#660874"><animate attributeName="width" from="0" to="120.9" dur="0.9s" begin="1.52s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect><text class="value" x="438" y="194" text-anchor="end" opacity="0">83<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.77s" fill="freeze"/></text></g><g class="row" style="animation-delay: 1.64s"><circle cx="28" cy="220" r="4" fill="#C084FC"><animate attributeName="r" values="0;5;4" dur="0.45s" begin="1.64s" fill="freeze"/></circle><text class="label" x="42" y="224">Followers</text><rect class="track" x="170" y="214" width="150" height="7" rx="3.5"/><rect class="bar" x="170" y="214" width="0" height="7" rx="3.5" fill="#C084FC"><animate attributeName="width" from="0" to="150.0" dur="0.9s" begin="1.64s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect><text class="value" x="438" y="224" text-anchor="end" opacity="0">103<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.89s" fill="freeze"/></text></g><g class="row" style="animation-delay: 1.76s"><circle cx="28" cy="250" r="4" fill="#9B59B6"><animate attributeName="r" values="0;5;4" dur="0.45s" begin="1.76s" fill="freeze"/></circle><text class="label" x="42" y="254">Pull Requests</text><rect class="track" x="170" y="244" width="150" height="7" rx="3.5"/><rect class="bar" x="170" y="244" width="0" height="7" rx="3.5" fill="#9B59B6"><animate attributeName="width" from="0" to="20.4" dur="0.9s" begin="1.76s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect><text class="value" x="438" y="254" text-anchor="end" opacity="0">14<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.01s" fill="freeze"/></text></g><g class="row" style="animation-delay: 1.88s"><circle cx="28" cy="280" r="4" fill="#B57EDC"><animate attributeName="r" values="0;5;4" dur="0.45s" begin="1.88s" fill="freeze"/></circle><text class="label" x="42" y="284">Issues</text><rect class="track" x="170" y="274" width="150" height="7" rx="3.5"/><rect class="bar" x="170" y="274" width="0" height="7" rx="3.5" fill="#B57EDC"><animate attributeName="width" from="0" to="77.2" dur="0.9s" begin="1.88s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect><text class="value" x="438" y="284" text-anchor="end" opacity="0">53<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.13s" fill="freeze"/></text></g>
</svg>
