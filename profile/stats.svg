<svg xmlns="http://www.w3.org/2000/svg" width="420" height="232" viewBox="0 0 420 232" role="img" aria-label="lingxitong GitHub stats">
<defs>
  <linearGradient id="statsStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#660874"/>
    <stop offset="100%" stop-color="#9B59B6"/>
  </linearGradient>
</defs>
<style>
  .title { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #660874; }
  .label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6B4E78; }
  .value { font: 700 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #3D0A4A; }
  .card { fill: #FCF8FF; stroke: url(#statsStroke); }
</style>
<rect class="card" x="0.5" y="0.5" width="419" height="231" rx="8"/>
<text class="title" x="20" y="30">lingxitong's GitHub Stats</text>
<circle cx="28" cy="54" r="4" fill="#D4A017"/>
<text class="label" x="42" y="58">Total Stars</text>
<text class="value" x="396" y="58" text-anchor="end">795</text>
<circle cx="28" cy="82" r="4" fill="#82318E"/>
<text class="label" x="42" y="86">Total Forks</text>
<text class="value" x="396" y="86" text-anchor="end">58</text>
<circle cx="28" cy="110" r="4" fill="#660874"/>
<text class="label" x="42" y="114">Public Repos</text>
<text class="value" x="396" y="114" text-anchor="end">83</text>
<circle cx="28" cy="138" r="4" fill="#C084FC"/>
<text class="label" x="42" y="142">Followers</text>
<text class="value" x="396" y="142" text-anchor="end">103</text>
<circle cx="28" cy="166" r="4" fill="#9B59B6"/>
<text class="label" x="42" y="170">Pull Requests</text>
<text class="value" x="396" y="170" text-anchor="end">14</text>
<circle cx="28" cy="194" r="4" fill="#B57EDC"/>
<text class="label" x="42" y="198">Issues</text>
<text class="value" x="396" y="198" text-anchor="end">53</text>
</svg>
