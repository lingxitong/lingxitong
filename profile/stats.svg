<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="lingxitong GitHub stats">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#660874"/>
  <stop offset="100%" stop-color="#73408A"/>
</linearGradient>
  <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="520" height="300" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="518" height="298" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>

<text x="22" y="34" fill="#FFFFFF" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="15" font-weight="700">
  lingxitong · Research Dashboard
</text>
<text x="22" y="52" fill="#F3E8FF" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11" font-weight="600">
  Live GitHub Metrics
</text>

<!-- STAR CORE -->
<g transform="translate(20, 68)">
  <rect width="230" height="200" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <circle cx="115" cy="100" r="78" fill="none" stroke="#F5D76E" stroke-width="2" stroke-dasharray="8 10" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" from="0 115 100" to="360 115 100" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="100" r="62" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="390" stroke-dashoffset="390" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="390" to="70" dur="1.6s" fill="freeze"
             calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </circle>
  <polygon points="115,48 122,72 148,72 127,88 135,114 115,98 95,114 103,88 82,72 108,72"
           fill="#F5D76E" filter="url(#goldGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
