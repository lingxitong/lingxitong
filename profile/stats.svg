erif" font-size="52" font-weight="800" opacity="0">706<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.98s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#F5D76E" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0" filter="url(#goldGlow)">795<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.12s" fill="freeze"/></text>
  <text text-anchor="middle" x="115" y="192" fill="#F3E8FF" font-family="Segoe UI, Ubuntu, Sans-Serif"
        font-size="13" font-weight="700">TOTAL STARS</text>
</g>

