<svg xmlns="http://www.w3.org/2000/svg" width="360" height="122" viewBox="0 0 360 122" role="img" aria-label="Top Languages">
<defs>
  <linearGradient id="langStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#660874"/>
    <stop offset="100%" stop-color="#9B59B6"/>
  </linearGradient>
</defs>
<style>
  .title { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #660874; }
  .label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6B4E78; }
  .pct { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #3D0A4A; }
  .track { fill: #EDE0F5; }
  .card { fill: #FCF8FF; stroke: url(#langStroke); }
  .lang-row { opacity: 0; animation: fadeUp 0.5s ease forwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
<rect class="card" x="0.5" y="0.5" width="359" height="121" rx="8"/>
<text class="title" x="20" y="30">Most Used Languages</text>
<g class="lang-row" style="animation-delay:0.15s"><text class="label" x="20" y="54">Python</text><rect class="track" x="130" y="44" width="160" height="8" rx="4"/><rect x="130" y="44" width="0" height="8" rx="4" fill="#660874"><animate attributeName="width" from="0" to="160.0" dur="1s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect><text class="pct" x="340" y="54" text-anchor="end" opacity="0">94.1%<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.50s" fill="freeze"/></text></g><g class="lang-row" style="animation-delay:0.29s"><text class="label" x="20" y="80">Groovy</text><rect class="track" x="130" y="70" width="160" height="8" rx="4"/><rect x="130" y="70" width="0" height="8" rx="4" fill="#82318E"><animate attributeName="width" from="0" to="10.0" dur="1s" begin="0.29s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect><text class="pct" x="340" y="80" text-anchor="end" opacity="0">5.9%<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.64s" fill="freeze"/></text></g>
</svg>
