<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Top Languages">
<defs>
  <linearGradient id="langBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#12061A"/>
    <stop offset="100%" stop-color="#2A0B3D"/>
  </linearGradient>
  <filter id="arcGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
