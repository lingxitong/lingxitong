<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="lingxitong GitHub stats">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#12061A"/>
    <stop offset="50%" stop-color="#1C0A2E"/>
    <stop offset="100%" stop-color="#2A0B3D"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3B1058"/>
    <stop offset="100%" stop-color="#1A0826"/>
  </linearGradient>
  <radialGradient id="aura" cx="35%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#82318E" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#12061A" stop-opacity="0"/>
  </radialGradient>
  <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="520" height="300" rx="18" fill="url(#bg)"/>
<rect width="520" height="300" rx="18" fill="url(#aura)"/>
<rect x="1" y="1" width="518" height="298" rx="17" fill="none" stroke="#A855F7" stroke-opacity="0.55">
  <animate attributeName="stroke-opacity" values="0.35;0.85;0.35" dur="2.8s" repeatCount="indefinite"/>
</rect>

<text x="22" y="34" fill="#E9D5FF" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="15" font-weight="700">
  lingxitong · Research Dashboard
</text>
<text x="22" y="52" fill="#A78BFA" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11" font-weight="600">
  Tsinghua Purple · Live GitHub Metrics
</text>

<!-- STAR CORE -->
<g transform="translate(20, 68)">
  <rect width="230" height="200" rx="16" fill="url(#panel)" stroke="#C084FC" stroke-opacity="0.45"/>
  <circle cx="115" cy="100" r="78" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="8 10" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 115 100" to="360 115 100" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="100" r="62" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="390" stroke-dashoffset="390">
    <animate attributeName="stroke-dashoffset" from="390" to="70" dur="1.6s" fill="freeze"
             calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <polygon points="115,48 122,72 148,72 127,88 135,114 115,98 95,114 103,88 82,72 108,72"
           fill="#FDE68A" filter="url(#goldGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
  <text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">88<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.00s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">176<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.14s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">265<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.28s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">353<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.42s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">442<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.56s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">530<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.70s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">619<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.84s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0">707<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="0.14s" begin="0.98s" fill="remove"/></text><text text-anchor="middle" x="132" y="168" fill="#FDE68A" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="52" font-weight="800" opacity="0" filter="url(#goldGlow)">796<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.12s" fill="freeze"/></text>
  <text text-anchor="middle" x="115" y="192" fill="#E9D5FF" font-family="Segoe UI, Ubuntu, Sans-Serif"
        font-size="13" font-weight="700">TOTAL STARS</text>
</g>

<g transform="translate(270,70)"><rect width="105" height="58" rx="12" fill="#2A1038" stroke="#C084FC" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.10s" fill="freeze"/></rect><text x="12" y="22" fill="#C4B5D4" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11" font-weight="600" opacity="0">Forks<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.20s" fill="freeze"/></text><text x="12" y="44" fill="#C084FC" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="20" font-weight="800" opacity="0">58<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.28s" fill="freeze"/></text><rect x="0" y="56" width="0" height="2" rx="1" fill="#C084FC"><animate attributeName="width" from="0" to="105" dur="0.7s" begin="1.10s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect></g><g transform="translate(385,70)"><rect width="105" height="58" rx="12" fill="#2A1038" stroke="#E9D5FF" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.20s" fill="freeze"/></rect><text x="12" y="22" fill="#C4B5D4" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11" font-weight="600" opacity="0">Repos<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.30s" fill="freeze"/></text><text x="12" y="44" fill="#E9D5FF" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="20" font-weight="800" opacity="0">83<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.38s" fill="freeze"/></text><rect x="0" y="56" width="0" height="2" rx="1" fill="#E9D5FF"><animate attributeName="width" from="0" to="105" dur="0.7s" begin="1.20s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect></g><g transform="translate(270,140)"><rect width="105" height="58" rx="12" fill="#2A1038" stroke="#F0ABFC" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.30s" fill="freeze"/></rect><text x="12" y="22" fill="#C4B5D4" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11" font-weight="600" opacity="0">Followers<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.40s" fill="freeze"/></text><text x="12" y="44" fill="#F0ABFC" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="20" font-weight="800" opacity="0">103<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.48s" fill="freeze"/></text><rect x="0" y="56" width="0" height="2" rx="1" fill="#F0ABFC"><animate attributeName="width" from="0" to="105" dur="0.7s" begin="1.30s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect></g><g transform="translate(385,140)"><rect width="105" height="58" rx="12" fill="#2A1038" stroke="#D8B4FE" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.40s" fill="freeze"/></rect><text x="12" y="22" fill="#C4B5D4" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11" font-weight="600" opacity="0">PRs<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.50s" fill="freeze"/></text><text x="12" y="44" fill="#D8B4FE" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="20" font-weight="800" opacity="0">14<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.58s" fill="freeze"/></text><rect x="0" y="56" width="0" height="2" rx="1" fill="#D8B4FE"><animate attributeName="width" from="0" to="105" dur="0.7s" begin="1.40s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect></g><g transform="translate(270,210)"><rect width="105" height="58" rx="12" fill="#2A1038" stroke="#A78BFA" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.50s" fill="freeze"/></rect><text x="12" y="22" fill="#C4B5D4" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11" font-weight="600" opacity="0">Issues<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.60s" fill="freeze"/></text><text x="12" y="44" fill="#A78BFA" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="20" font-weight="800" opacity="0">53<animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.68s" fill="freeze"/></text><rect x="0" y="56" width="0" height="2" rx="1" fill="#A78BFA"><animate attributeName="width" from="0" to="105" dur="0.7s" begin="1.50s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/></rect></g>
</svg>
